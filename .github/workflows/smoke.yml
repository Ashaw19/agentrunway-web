name: Production Smoke Test

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    # Pinned: ubuntu-latest moved to 26.04 (~2026-11-13) and Playwright
    # 1.59.x can't install Chromium there (26.04 support landed in 1.61).
    # Unpin when @playwright/test is upgraded to >=1.61.
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: cd apps/web && npx playwright install chromium --with-deps

      - name: Run smoke tests against production
        run: cd apps/web && npx playwright test e2e/smoke.spec.ts --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: https://agentrunway.ca
