name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm turbo test

      - name: Build web app
        run: pnpm turbo build --filter=agentrunway-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SENTRY_DSN: https://placeholder@sentry.io/0

      - name: Check bundle size
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh apps/web/.next/static/chunks/*.js 2>/dev/null | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY || echo "No chunks found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          TOTAL=$(du -sh apps/web/.next 2>/dev/null | cut -f1)
          echo "**Total .next size: $TOTAL**" >> $GITHUB_STEP_SUMMARY

      - name: Type check
        run: pnpm turbo typecheck --filter=agentrunway-web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: cd apps/web && npx playwright install chromium --with-deps

      - name: Run E2E tests against production
        run: cd apps/web && npx playwright test --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: https://agentrunway.ca
